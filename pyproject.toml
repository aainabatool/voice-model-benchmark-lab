[project]
name = "voice-model-benchmark-lab"
version = "0.1.0"
description = "Local-first benchmarking platform for STT/TTS voice models: accuracy, latency, resource usage, quality, and robustness."
readme = "README.md"
authors = [
    { name = "Aaina Batool", email = "b.aaina@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
    "vosk>=0.3.45",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "voice_benchmark"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
